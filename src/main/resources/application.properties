spring.application.name=spring-ai-assistant

# Google Gemini API Configuration

spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-flash-latest
logging.level.org.springframework.ai.chat.client.advisor=DEBUG


logging.level.org.springframework.ai.google.genai=DEBUG
logging.level.org.springframework.web.client=DEBUG